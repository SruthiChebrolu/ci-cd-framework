# ============================================================
# ENTERPRISE CI/CD FRAMEWORK - DEFAULT CONFIGURATION
# ============================================================

# ------------------------------------------------------------
# APPLICATION
# ------------------------------------------------------------

APP_NAME=
APP_TYPE=auto

# Supported:
# auto
# java
# springboot
# java-war
# node
# react
# python
# android
# ios

# ------------------------------------------------------------
# SOURCE CONTROL
# ------------------------------------------------------------

SOURCE_CONTROL=git
REPOSITORY_URL=
BRANCH=main
CREDENTIALS_ID=

# Supported providers:
# github
# gitlab
# bitbucket
# azure-repos
# git

# Normally REPOSITORY_URL/BRANCH come from Jenkins SCM.
# These properties allow override when required.

# ------------------------------------------------------------
# BUILD
# ------------------------------------------------------------

BUILD_TOOL=auto

# Supported:
# auto
# maven
# gradle
# npm
# yarn
# pip

BUILD_GOAL=
TEST_ENABLED=true

# ------------------------------------------------------------
# SONARQUBE
# ------------------------------------------------------------

SONAR_ENABLED=false
SONAR_PROJECT_KEY=
SONAR_PROJECT_NAME=
SONAR_SOURCES=src
SONAR_BINARIES=

QUALITY_GATE_ENABLED=false

# ------------------------------------------------------------
# ARTIFACT
# ------------------------------------------------------------

ARTIFACT_TYPE=auto
ARTIFACT_PATH=

# Examples:
# target/*.jar
# target/*.war
# build/libs/*.jar
# dist/**
# build/**
# dist/*.whl
# app/build/outputs/apk/**/*.apk

ARTIFACT_REPOSITORY_TYPE=jenkins

# Future values:
# jenkins
# nexus
# artifactory
# s3
# docker-registry

# ------------------------------------------------------------
# DEPLOYMENT
# ------------------------------------------------------------

DEPLOYMENT_ENABLED=false
DEPLOYMENT_TYPE=none

# Supported deployment types can eventually include:
# none
# local-copy
# tomcat
# springboot-service
# nginx
# docker
# kubernetes

# ------------------------------------------------------------
# ENVIRONMENT PROMOTION
# ------------------------------------------------------------

DEV_ENABLED=true
SIT_ENABLED=true
QA_ENABLED=true
UAT_ENABLED=true
PROD_ENABLED=true

QA_APPROVAL=true
UAT_APPROVAL=true
PROD_APPROVAL=true

# ------------------------------------------------------------
# HEALTH CHECK
# ------------------------------------------------------------

HEALTH_CHECK_ENABLED=false
HEALTH_CHECK_TYPE=http
HEALTH_CHECK_PATH=/health
EXPECTED_HTTP_STATUS=200

# The hostname should NOT be stored here.
# Jenkins/environment configuration supplies it.

# ------------------------------------------------------------
# ROLLBACK
# ------------------------------------------------------------

ROLLBACK_ENABLED=true
AUTO_ROLLBACK=false

ROLLBACK_STRATEGY=previous

# Supported:
# previous
# last-known-good

# ------------------------------------------------------------
# METADATA
# ------------------------------------------------------------

METADATA_ENABLED=true
CHECKSUM_ENABLED=true